name: Java CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then chmod +x gradlew; fi

    - name: Build (assemble & test)
      run: |
        if [ -f "gradlew" ]; then ./gradlew clean build --no-daemon --console=plain; else mvn -q -DskipTests=false test; fi

    - name: Upload test results (JUnit XML)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          **/build/test-results/test/**/*.xml
          **/target/surefire-reports/*.xml

    - name: Upload Minecraft mod files
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: minecraft-mods
        path: |
          **/build/libs/*.jar
          **/target/*.jar

    - name: Show build output on success
      if: success()
      run: echo "Build and tests passed — ✅"
