name: Build Fabric Mod

on: [push]

jobs:
  build:
    runs-running: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Mod
        run: |
          mkdir -p build/classes
          javac -cp "libs/*" -d build/classes com/serversecurity/*.java
          cd build/classes
          zip -r ../../MySecurityMod.jar .
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v3
        with:
          name: SecurityModJar
          path: MySecurityMod.jar
