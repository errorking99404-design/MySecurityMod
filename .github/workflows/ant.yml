  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Make Gradle wrapper executable
    run: chmod +x ./gradlew

  - name: Build with Gradle Wrapper
    run: ./gradlew build --no-daemon

  - name: Upload Mod Jar
    uses: actions/upload-artifact@v4
    with:
      name: SecurityModJar
      path: build/libs/*.jar
